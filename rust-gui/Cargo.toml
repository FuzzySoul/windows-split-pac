[package]
name = "windows-split-pac-gui"
version = "0.3.4"
edition = "2024"
description = "A native Windows control center for GFWList PAC split routing"
license = "MIT"

[dependencies]
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Pure engine/identity logic lives in `core/` (no eframe), so it unit-tests headless.
windows-split-pac-core = { path = "core" }

[workspace]
members = ["core"]
