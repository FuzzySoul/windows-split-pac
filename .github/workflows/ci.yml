name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  rust-quality:
    name: Rust quality gate
    runs-on: windows-latest
    defaults:
      run:
        working-directory: rust-gui
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Run Rust tests
        run: cargo test --all-targets

  pac-isolation:
    name: PAC isolation test
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install tested PAC dependencies
        shell: pwsh
        run: .\scripts\Install-Dependencies.ps1
      - name: Verify PAC generation and routing decisions
        shell: pwsh
        run: .\scripts\Test-Package.ps1
      - name: VM E2E - isolated pipeline (temp port, no registry/no live)
        shell: pwsh
        run: .\scripts\Test-Isolated.ps1
      - name: VM E2E - fresh-machine GFWList
        shell: pwsh
        run: .\scripts\Test-GfwList.ps1

  release-package:
    name: Portable release smoke test
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build release executable
        run: cargo build --release --manifest-path rust-gui\Cargo.toml
      - name: Assemble portable package
        shell: pwsh
        run: .\scripts\Build-ReleasePackage.ps1 -ExecutablePath .\rust-gui\target\release\windows-split-pac-gui.exe
      - name: Extract package into a clean directory
        shell: pwsh
        run: |
          $extract = Join-Path $env:RUNNER_TEMP 'windows-split-pac-release-test'
          Remove-Item -LiteralPath $extract -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $extract | Out-Null
          Expand-Archive -LiteralPath .\release\WindowsSplitPAC.zip -DestinationPath $extract -Force
          "PACKAGE_DIR=$extract" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Test the extracted portable package
        shell: pwsh
        run: .\scripts\Test-ReleasePackage.ps1 -PackageDir $env:PACKAGE_DIR
